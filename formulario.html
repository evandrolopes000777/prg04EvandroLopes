    <div class="container-vidro">
        <main>
            <h1>Faça o seu login!</h1>
            <form id="form-login">
                <input type="text" id="email" name="Usuario" placeholder="Digite seu e-mail">
                <span id="erro-email" style="color: #ff4d4d; font-size: 0.85rem; display: none; margin-bottom: 10px; display: block;"></span>
                <input type="password" id="senha" name="Senha" placeholder="Digite sua Senha">
                <span id="erro-senha" style="color: #ff4d4d; font-size: 0.85rem; display: none; margin-bottom: 10px;"></span>
                <button type="submit">Login</button>
            </form>
        </main>


    </div>
